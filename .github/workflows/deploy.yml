name: Deploy para HostGator

on:
  push:
    branches: [main]
  workflow_dispatch:

# Um deploy por vez: dois syncs FTP simultâneos corrompem o state file
# (mesma lição aprendida nos repos do site principal e do antihype).
concurrency:
  group: deploy-website-autonomia
  cancel-in-progress: false

jobs:
  deploy:
    name: Sync FTPS para HostGator
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      # Chaves do Asaas e cupons vêm dos secrets do repositório (o repo é público).
      # O arquivo gerado vai só pro servidor; nunca é commitado.
      - name: Gerar config secreta do checkout
        env:
          ASAAS_ENV: ${{ secrets.ASAAS_ENV }}
          ASAAS_API_KEY: ${{ secrets.ASAAS_API_KEY }}
          ASAAS_WEBHOOK_TOKEN: ${{ secrets.ASAAS_WEBHOOK_TOKEN }}
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          ADMIN_USER: ${{ secrets.ADMIN_USER }}
          ADMIN_PASS_HASH: ${{ secrets.ADMIN_PASS_HASH }}
          GRUPO_WHATSAPP: ${{ secrets.GRUPO_WHATSAPP }}
          CUPONS_JSON: ${{ secrets.CUPONS_JSON }}
        run: |
          php -r '
            $c = json_decode(getenv("CUPONS_JSON") ?: "{}", true);
            if (!is_array($c)) { fwrite(STDERR, "CUPONS_JSON invalido\n"); exit(1); }
            $cfg = [
              "env" => getenv("ASAAS_ENV") === "production" ? "production" : "sandbox",
              "asaas_key" => (string) getenv("ASAAS_API_KEY"),
              "webhook_token" => (string) getenv("ASAAS_WEBHOOK_TOKEN"),
              "admin_key" => (string) getenv("ADMIN_KEY"),
              "admin_user" => (string) getenv("ADMIN_USER"),
              "admin_pass_hash" => (string) getenv("ADMIN_PASS_HASH"),
              "grupo_whatsapp" => (string) getenv("GRUPO_WHATSAPP"),
              "cupons" => $c,
            ];
            file_put_contents("api/_config-secret.php", "<?php\nreturn " . var_export($cfg, true) . ";\n");
            echo "config gerada: ambiente ", $cfg["env"], ", ", count($c), " cupom(ns)\n";
          '

      # Site estático (index.html + brand/ + images/) + PHP do checkout em api/, sem build.
      # A conta FTP deve ter a pasta apontada pro document root do domínio
      # no cPanel — mesmo padrão do antihype (github@antihype.ai → /public_html/).
      - name: Deploy via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /public_html/
          protocol: ftps
          port: 21
          state-name: .ftp-deploy-sync-state-website-autonomia-v1.json
          exclude: |
            **/.git*
            **/.git*/**
            api/_data/**
